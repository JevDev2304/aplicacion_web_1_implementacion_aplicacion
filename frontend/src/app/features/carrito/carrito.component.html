<div class="pagina">
  <header class="pagina__header">
    <div>
      <h1>Tu carrito</h1>
      <p class="pagina__subtitle">Revisa tus productos antes de confirmar la compra</p>
    </div>
    <button type="button" class="boton boton--secundario" (click)="volverAlCatalogo()">
      <mat-icon class="icono">arrow_back</mat-icon> Seguir comprando
    </button>
  </header>

  <p *ngIf="mensaje" class="mensaje mensaje--ok">{{ mensaje }}</p>
  <p *ngIf="error" class="mensaje mensaje--error">{{ error }}</p>

  <p *ngIf="cargando">Cargando carrito...</p>

  <ng-container *ngIf="!cargando && carrito">
    <section class="tarjeta" *ngIf="carrito.items.length">
      <table class="tabla">
        <thead>
          <tr>
            <th>Producto</th>
            <th>Cantidad</th>
            <th>Total</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of carrito.items">
            <td>{{ item.nombreProducto }}</td>
            <td>{{ item.cantidad }}</td>
            <td>{{ item.total | number: '1.0-2' }}</td>
            <td>
              <button type="button" class="boton boton--peligro" (click)="eliminarItem(item.id)">
                <mat-icon class="icono">delete</mat-icon> Eliminar
              </button>
            </td>
          </tr>
        </tbody>
      </table>

      <div class="carrito-resumen">
        <span class="carrito-resumen__total">Total: {{ carrito.total | number: '1.0-2' }}</span>
        <button type="button" class="boton boton--primario" (click)="confirmarCompra()">
          <mat-icon class="icono">payments</mat-icon> Confirmar compra
        </button>
      </div>
    </section>

    <p *ngIf="!carrito.items.length">Tu carrito está vacío.</p>
  </ng-container>
</div>
